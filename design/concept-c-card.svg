<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="deltaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <rect x="2" y="2" width="796" height="796" rx="38" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Centered Scaled Logo Mark (Original 256x256 scaled to 480x480 at offset 160, 120) -->
  <g transform="translate(160, 120) scale(1.875)">
    <!-- Outer Delta Frame with exact 60-degree angles -->
    <path d="M 128 45.72 L 224 212 L 176 212 L 128 128.86 L 80 212 L 32 212 Z
             M 128 85 L 152 126.57 L 104 126.57 Z" 
          fill="url(#deltaGrad)"/>
    <!-- Dynamic Forward Agent Vector -->
    <polygon points="108,180 156,180 172,164 156,148 108,148 124,164" 
             fill="url(#vectorGrad)" filter="url(#glow)"/>
  </g>

  <!-- Technical Card Typography -->
  <text x="400" y="650" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="4">CONCEPT C</text>
  <text x="400" y="690" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="1">Escape Velocity Delta</text>
  <text x="400" y="725" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">60-degree equilateral apex traversing commercial billing barriers</text>
</svg>
