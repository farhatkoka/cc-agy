<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <rect x="2" y="2" width="796" height="796" rx="38" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Centered Scaled Logo Mark (Original 256x256 scaled to 480x480 at offset 160, 120) -->
  <g transform="translate(160, 120) scale(1.875)">
    <!-- Left Claude Terminal Arch -->
    <path d="M 64 64 C 28 100 28 156 64 192 C 92 220 134 224 166 204 L 144 178 C 124 190 98 186 80 168 C 58 146 58 110 80 88 C 98 70 124 66 144 78 L 166 52 C 134 32 92 36 64 64 Z" 
          fill="url(#amberGrad)"/>
    <!-- Forward Agentic Vector Chevron (Bridge Core) -->
    <path d="M 120 108 L 160 128 L 120 148 L 132 172 L 196 140 L 196 116 L 132 84 Z" 
          fill="url(#cyanGrad)" filter="url(#glow)"/>
    <!-- Antigravity Acceleration Node -->
    <polygon points="212,128 196,96 196,160" fill="#38BDF8" filter="url(#glow)"/>
  </g>

  <!-- Technical Card Typography -->
  <text x="400" y="650" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="4">CONCEPT A</text>
  <text x="400" y="690" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="1">The Asymmetric Gateway Bridge</text>
  <text x="400" y="725" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Interlocking Claude terminal arc meets Antigravity acceleration node</text>
</svg>
