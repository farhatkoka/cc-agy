<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tpuFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="coreCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="40" fill="url(#bg)"/>
  <rect x="2" y="2" width="796" height="796" rx="38" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Centered Scaled Logo Mark (Original 256x256 scaled to 480x480 at offset 160, 120) -->
  <g transform="translate(160, 120) scale(1.875)">
    <!-- Outer Octagonal TPU Silicon Die -->
    <path d="M 96 32 L 160 32 L 224 96 L 224 160 L 160 224 L 96 224 L 32 160 L 32 96 Z
             M 102 56 L 56 102 L 56 154 L 102 200 L 154 200 L 200 154 L 200 102 L 154 56 Z" 
          fill="url(#tpuFrame)" stroke="#475569" stroke-width="1.5"/>
    <!-- Center Monolithic CLI Agent Core (Chevron + Cursor) -->
    <path d="M 96 92 L 132 128 L 96 164 L 114 176 L 162 128 L 114 80 Z" 
          fill="url(#coreCyan)" filter="url(#glow)"/>
    <rect x="144" y="156" width="24" height="12" rx="2" fill="#F59E0B" filter="url(#glow)"/>
  </g>

  <!-- Technical Card Typography -->
  <text x="400" y="650" text-anchor="middle" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="4">CONCEPT B (RECOMMENDED)</text>
  <text x="400" y="690" text-anchor="middle" fill="#94A3B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="500" letter-spacing="1">TPU Silicon Compute Core</text>
  <text x="400" y="725" text-anchor="middle" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Octagonal TPU silicon die with embedded agent CLI prompt</text>
</svg>
