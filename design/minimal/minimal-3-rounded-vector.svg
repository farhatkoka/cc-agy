<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="m3Amber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <linearGradient id="m3Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="m3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND -->

  <!-- Modern Rounded Minimal Vector -->
  <g transform="translate(256, 256) scale(1.6) translate(-248, -256)" filter="url(#m3Glow)">
    <!-- Claude Code Prompt Chevron (Rounded Corners) -->
    <path d="M 148 180 
             L 236 256 
             L 148 332 
             L 180 360 
             L 296 256 
             L 180 152 Z" 
          fill="url(#m3Amber)"
          stroke="url(#m3Amber)"
          stroke-width="8"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Antigravity Node (Rounded Corners) -->
    <polygon points="268,256 348,188 348,324" 
             fill="url(#m3Cyan)"
             stroke="url(#m3Cyan)"
             stroke-width="8"
             stroke-linejoin="round"
             stroke-linecap="round" />

    <!-- Center Zero-Cost Nexus Flare -->
    <circle cx="256" cy="256" r="8" fill="#FFFFFF" />
  </g>
</svg>
