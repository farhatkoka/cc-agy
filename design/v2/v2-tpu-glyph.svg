<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Silicon Trace Gradient -->
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Claude Flame / Terracotta -->
    <linearGradient id="claudeCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Antigravity Cyan Vector -->
    <linearGradient id="agyVector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="vectorBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (No bounding box) -->

  <!-- Octagonal Silicon TPU Perimeter -->
  <g id="silicon-die" stroke="#475569" stroke-width="6" fill="none" opacity="0.85">
    <path d="M 160 48 L 352 48 L 464 160 L 464 352 L 352 464 L 160 464 L 48 352 L 48 160 Z" />
    <!-- Inner Circuit Ring -->
    <path d="M 176 88 L 336 88 L 424 176 L 424 336 L 336 424 L 176 424 L 88 336 L 88 176 Z" 
          stroke="#334155" stroke-width="3" stroke-dasharray="16 8" />
  </g>

  <!-- Central Dynamic Gateway Core -->
  <g id="core-dynamics" filter="url(#vectorBloom)">
    <!-- Claude Code CLI Prompt Chevron (Left to Center) -->
    <path d="M 148 180 L 236 256 L 148 332 L 180 360 L 296 256 L 180 152 Z" 
          fill="url(#claudeCore)" />

    <!-- Antigravity Acceleration Node (Center to Right) -->
    <polygon points="268,256 348,188 348,324" 
             fill="url(#agyVector)" />

    <!-- Center Zero-Cost Nexus Flare -->
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Corner Silicon Pins (Discrete Modern Engineering Accents) -->
  <g fill="#38BDF8" opacity="0.7">
    <rect x="248" y="24" width="16" height="16" rx="3" />
    <rect x="248" y="472" width="16" height="16" rx="3" />
    <rect x="24" y="248" width="16" height="16" rx="3" />
    <rect x="472" y="248" width="16" height="16" rx="3" />
  </g>
</svg>
