<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Claude Warm Gradient -->
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Antigravity / TPU Cyan Gradient -->
    <linearGradient id="tpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Bridge Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Bridge Axis Track -->
  <line x1="190" y1="256" x2="320" y2="256" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" stroke-linecap="round" />

  <!-- Left: Claude Terminal Chevron (CLI Input) -->
  <path d="M 140 180 L 216 256 L 140 332" 
        fill="none" 
        stroke="url(#claudeGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Terminal Underscore Cursor -->
  <line x1="216" y1="332" x2="252" y2="332" 
        stroke="url(#claudeGrad)" 
        stroke-width="22" 
        stroke-linecap="round" />

  <!-- Center Bridge Core Node -->
  <circle cx="280" cy="256" r="14" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="280" cy="256" r="7" fill="#FFFFFF" />

  <!-- Right: Antigravity Lightning / Quantum TPU Pulse -->
  <path d="M 360 144 L 310 246 L 364 246 L 320 368 L 400 236 L 348 236 Z" 
        fill="url(#tpuGrad)" 
        stroke="#60A5FA" 
        stroke-width="4" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Micro Technical Label -->
  <text x="256" y="440" 
        text-anchor="middle" 
        fill="#64748B" 
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
        font-size="22" 
        font-weight="700" 
        letter-spacing="6">CC-AGY GATEWAY</text>
</svg>
